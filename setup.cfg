[metadata]
name = nicheenergy
version = 0.1.0
author = NicheEnergy contributors
description = Disentanglement-based self-supervised framework for label-free spatial niche identification
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD-3-Clause
license_files =
    LICENSE
classifiers =
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: BSD License
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.10,<3.11
install_requires =
    numpy==1.26.4
    pandas==2.3.3
    scipy==1.15.2
    anndata==0.8.0
    scanpy==1.11.5
    scikit-learn==1.7.2
    statsmodels==0.14.6
    torch==2.5.1
    torch-geometric==2.7.0
    pytorch-lightning==1.8.6
    scvi-tools==0.16.1
    py-pcha==0.1.3
    jax==0.4.28
    jaxlib==0.4.28
    flax==0.8.5
    optax==0.2.2

[options.packages.find]
where = .
include = nicheenergy*
